<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mini Watch Dynamic Island</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --island: #050505;
      --stroke: rgba(255, 255, 255, .12);
      --text: #f7f7f7;
      --muted: #8f8f8f;
      --green: #23f06b;
      --yellow: #ffd233;
      --red: #ff3434;
      --blue: #66d9ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, .08), transparent 28%),
        linear-gradient(180deg, #181818 0%, var(--bg) 50%, #020202 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: start center;
      padding: calc(env(safe-area-inset-top) + 18px) 18px 18px;
    }

    .phone {
      position: relative;
      width: min(100%, 430px);
      height: 100dvh;
    }

    .island {
      position: absolute;
      left: 50%;
      top: 0;
      width: 128px;
      min-height: 38px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--island);
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .09),
        0 18px 70px rgba(0, 0, 0, .75);
      overflow: hidden;
      transition: width .35s cubic-bezier(.2, .9, .18, 1), min-height .35s cubic-bezier(.2, .9, .18, 1), border-radius .35s ease;
    }

    .island.idle {
      width: 128px;
      min-height: 38px;
    }

    .island.working {
      width: min(86vw, 360px);
      min-height: 76px;
      border-radius: 34px;
    }

    .island.alert {
      width: min(90vw, 390px);
      min-height: 104px;
      border-radius: 36px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .1),
        0 0 0 1px rgba(255, 52, 52, .25),
        0 24px 90px rgba(255, 52, 52, .18),
        0 18px 70px rgba(0, 0, 0, .75);
    }

    .compact {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 1;
      transition: opacity .2s ease;
    }

    .island:not(.idle) .compact {
      opacity: 0;
      pointer-events: none;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 18px var(--green);
    }

    .compact-text {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .expanded {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      padding: 14px 16px;
      transition: opacity .22s ease, transform .22s ease;
    }

    .island:not(.idle) .expanded {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .copy {
      min-width: 0;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .headline {
      margin-top: 3px;
      font-size: 18px;
      font-weight: 850;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-orb {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 26px rgba(35, 240, 107, .75);
    }

    .working .status-orb {
      background: conic-gradient(from 0deg, var(--red), var(--yellow), var(--green), var(--blue), var(--red));
      animation: spin 1.1s linear infinite;
      box-shadow: 0 0 28px rgba(102, 217, 255, .55);
    }

    .alert .status-orb {
      background: radial-gradient(circle at 35% 30%, #fff0f0, #ff7474 18%, var(--red) 55%, #870000 100%);
      box-shadow: 0 0 34px rgba(255, 52, 52, .9);
      animation: pulse .72s ease-in-out infinite alternate;
    }

    .activity {
      display: none;
      margin-top: 12px;
      height: 20px;
      align-items: end;
      gap: 5px;
    }

    .working .activity {
      display: flex;
    }

    .bar {
      width: 9px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--blue), var(--green));
      animation: wave .7s ease-in-out infinite alternate;
    }

    .bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .bar:nth-child(2) { height: 16px; animation-delay: .08s; }
    .bar:nth-child(3) { height: 11px; animation-delay: .16s; }
    .bar:nth-child(4) { height: 19px; animation-delay: .24s; }
    .bar:nth-child(5) { height: 10px; animation-delay: .32s; }

    .alert-detail {
      display: none;
      margin-top: 12px;
      color: #ffb7b7;
      font-size: 13px;
      line-height: 1.35;
    }

    .alert .alert-detail {
      display: block;
    }

    .dock {
      position: absolute;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      width: min(92vw, 390px);
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, .1);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      backdrop-filter: blur(20px);
    }

    button[data-signal="working"] { color: #bfefff; }
    button[data-signal="off"] { color: #b6ffd0; }
    button[data-signal="permission"] { color: #ffc1c1; }
    button[data-signal="error"] { color: #ffc1c1; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      from { transform: scale(.96); filter: brightness(.92); }
      to { transform: scale(1.08); filter: brightness(1.25); }
    }

    @keyframes wave {
      from { transform: scaleY(.55); opacity: .55; }
      to { transform: scaleY(1.35); opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <section id="island" class="island idle" aria-live="polite">
      <div class="compact">
        <span class="dot"></span>
        <span class="compact-text">Idle</span>
      </div>

      <div class="expanded">
        <div class="row">
          <div class="copy">
            <div class="eyebrow">Codex</div>
            <div id="headline" class="headline">空闲</div>
          </div>
          <div class="status-orb"></div>
        </div>
        <div class="activity" aria-hidden="true">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
        <div id="detail" class="alert-detail">需要你处理后，Codex 才能继续。</div>
      </div>
    </section>

    <nav class="dock" aria-label="test controls">
      <button data-signal="working">工作</button>
      <button data-signal="off">空闲</button>
      <button data-signal="permission">权限</button>
      <button data-signal="error">错误</button>
    </nav>
  </main>

  <script>
    const island = document.getElementById('island');
    const headline = document.getElementById('headline');
    const detail = document.getElementById('detail');
    const alertSignals = new Set(['blocked', 'permission', 'interrupted', 'interrupt', 'error', 'failed', 'failure']);

    function apiBase() {
      if (location.port === '3000') return `${location.protocol}//${location.hostname}:3001`;
      return '';
    }

    function setState(aggregate, signal) {
      const isAlert = aggregate === 'blocked' || alertSignals.has(signal);
      island.className = `island ${isAlert ? 'alert' : aggregate === 'working' ? 'working' : 'idle'}`;

      if (isAlert) {
        headline.textContent = signal === 'permission' ? '等待权限确认' : signal === 'error' ? '任务出错' : '需要处理';
        detail.textContent = signal === 'permission'
          ? '请在电脑上确认权限请求。'
          : signal === 'error'
            ? 'Codex 遇到错误，请回到电脑查看。'
            : 'Codex 已中断或被阻塞。';
        return;
      }

      if (aggregate === 'working') {
        headline.textContent = 'Codex 正在工作';
        detail.textContent = '';
        return;
      }

      headline.textContent = '空闲';
      detail.textContent = '';
    }

    async function loadState() {
      try {
        const res = await fetch(`${apiBase()}/api/signal-light/state`, { cache: 'no-store' });
        const data = await res.json();
        const signals = Object.values(data.sessions || {}).map(s => s.signal);
        setState(data.aggregate, signals[0] || data.aggregate);
      } catch {}
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const host = location.port === '3000' ? `${location.hostname}:3001` : location.host;
      const ws = new WebSocket(`${proto}//${host}/api/ws`);

      ws.addEventListener('open', () => {
        ws.send(JSON.stringify({
          type: 'page_change',
          page: { id: 'dynamic_island', name: 'Dynamic Island' },
          ts: Date.now(),
        }));
      });

      ws.addEventListener('message', event => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'signal_light') setState(msg.aggregate, msg.signal);
        } catch {}
      });

      ws.addEventListener('close', () => setTimeout(connect, 1500));
    }

    document.querySelectorAll('button[data-signal]').forEach(button => {
      button.addEventListener('click', async () => {
        await fetch(`${apiBase()}/api/signal-light/state`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ signal: button.dataset.signal, session_id: 'codex' }),
        });
      });
    });

    loadState();
    connect();
    setInterval(loadState, 10000);
  </script>
</body>
</html>
